<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bêta Arsenal — Connexion Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <div class="container header-inner">
        <a href="/" class="brand">
          <span class="brand-mark">β</span>
          <span class="brand-name">Bêta Arsenal</span>
        </a>
        <div class="header-actions">
          <a href="/" class="btn btn-ghost" data-i18n="nav.home">Accueil</a>
        </div>
      </div>
    </header>

    <main class="container main-content auth-main">
      <div class="auth-card">
        <h1 data-i18n="admin.loginTitle">Espace administrateur</h1>
        <p class="auth-subtitle" data-i18n="admin.loginSubtitle">Connexion réservée au vendeur autorisé.</p>

        <form id="login-form" novalidate>
          <label for="admin-email" class="form-label" data-i18n="admin.email">Email</label>
          <input id="admin-email" type="email" name="email" required autocomplete="email" class="form-input" />

          <label for="admin-password" class="form-label" data-i18n="admin.password">Mot de passe</label>
          <input id="admin-password" type="password" name="password" required autocomplete="current-password" class="form-input" />

          <div id="login-error" class="form-error hidden"></div>

          <button id="login-submit" type="submit" class="btn btn-primary btn-block" data-i18n="admin.signIn">Se connecter</button>
        </form>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>© <span id="year"></span> Bêta Arsenal</p>
      </div>
    </footer>
  </div>

  <script type="module" src="../js/firebase-config.js"></script>
  <script type="module" src="../js/i18n.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
