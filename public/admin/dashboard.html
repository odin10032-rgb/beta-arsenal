<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bêta Arsenal — Tableau de bord</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- ============ HEADER ADMIN ============ -->
    <header class="site-header">
      <div class="container header-inner">
        <a href="/" class="brand">
          <span class="brand-mark">β</span>
          <span class="brand-name">Bêta Arsenal</span>
        </a>
        <div class="header-actions">
          <button id="lang-toggle" class="btn btn-ghost" aria-label="Changer la langue">
            <span id="lang-label">EN</span>
          </button>
          <span id="admin-email-display" class="admin-email-badge"></span>
          <button id="logout-btn" class="btn btn-ghost" data-i18n="admin.logout">Déconnexion</button>
        </div>
      </div>
    </header>

    <main class="container main-content">
      <h1 class="dashboard-title" data-i18n="admin.dashboard">Tableau de bord</h1>

      <!-- ============ STATISTIQUES ============ -->
      <section class="stats-grid" aria-label="Statistiques">
        <div class="stat-card">
          <div class="stat-label" data-i18n="admin.statTotal">Ventes totales</div>
          <div class="stat-value" id="stat-total">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label" data-i18n="admin.statApproved">Approuvées</div>
          <div class="stat-value stat-ok" id="stat-approved">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label" data-i18n="admin.statPending">En attente</div>
          <div class="stat-value stat-warn" id="stat-pending">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label" data-i18n="admin.statRevenue">Chiffre d'affaires</div>
          <div class="stat-value" id="stat-revenue">—</div>
        </div>
      </section>

      <!-- ============ ONGLETS ============ -->
      <div class="tabs" role="tablist">
        <button class="tab tab-active" role="tab" data-admin-tab="offers" data-i18n="admin.tabOffers">Offres</button>
        <button class="tab" role="tab" data-admin-tab="transactions" data-i18n="admin.tabTransactions">Transactions</button>
      </div>

      <!-- ============ SECTION OFFRES ============ -->
      <section id="admin-offers" class="admin-section tab-content tab-content-active">
        <div class="section-head">
          <h2 data-i18n="admin.offersTitle">Gestion des offres</h2>
          <button id="new-offer-btn" class="btn btn-primary" data-i18n="admin.newOffer">+ Nouvelle offre</button>
        </div>
        <div id="offers-list" class="offers-list" aria-live="polite">
          <div class="card-skeleton"></div>
          <div class="card-skeleton"></div>
        </div>
      </section>

      <!-- ============ SECTION TRANSACTIONS ============ -->
      <section id="admin-transactions" class="admin-section tab-content hidden">
        <div class="section-head">
          <h2 data-i18n="admin.transactionsTitle">Transactions</h2>
          <button id="refresh-tx-btn" class="btn btn-ghost" data-i18n="admin.refresh">Rafraîchir</button>
        </div>
        <div class="table-wrap">
          <table class="data-table" id="transactions-table">
            <thead>
              <tr>
                <th data-i18n="admin.txDate">Date</th>
                <th data-i18n="admin.txOffer">Offre</th>
                <th data-i18n="admin.txBuyer">Acheteur</th>
                <th data-i18n="admin.txAmount">Montant</th>
                <th data-i18n="admin.txStatus">Statut</th>
                <th data-i18n="admin.txActions">Actions</th>
              </tr>
            </thead>
            <tbody id="transactions-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>© <span id="year"></span> Bêta Arsenal</p>
      </div>
    </footer>
  </div>

  <!-- ============ MODALE FORMULAIRE OFFRE ============ -->
  <div id="offer-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="offer-modal-title">
    <div class="modal-backdrop" data-close-offer-modal></div>
    <div class="modal-card modal-card-wide">
      <button class="modal-close" data-close-offer-modal aria-label="Fermer">×</button>
      <h2 id="offer-modal-title" data-i18n="admin.offerFormTitle">Offre</h2>

      <form id="offer-form" novalidate>
        <input type="hidden" id="offer-id" />

        <!-- Type d'offre -->
        <label class="form-label" data-i18n="admin.offerType">Type d'offre</label>
        <select id="offer-type" class="form-input">
          <option value="digital_product" data-i18n="admin.typeDigital">Produit numérique</option>
          <option value="service" data-i18n="admin.typeService">Service</option>
        </select>

        <!-- Titres -->
        <label class="form-label" data-i18n="admin.titleFr">Titre (FR)</label>
        <input id="offer-title-fr" type="text" class="form-input" required />

        <label class="form-label" data-i18n="admin.titleEn">Titre (EN)</label>
        <input id="offer-title-en" type="text" class="form-input" required />

        <!-- Descriptions -->
        <label class="form-label" data-i18n="admin.descFr">Description (FR)</label>
        <textarea id="offer-desc-fr" class="form-input" rows="3" required></textarea>

        <label class="form-label" data-i18n="admin.descEn">Description (EN)</label>
        <textarea id="offer-desc-en" class="form-input" rows="3" required></textarea>

        <!-- Prix & devise -->
        <div class="form-row">
          <div>
            <label class="form-label" data-i18n="admin.price">Prix (entier, ex: 5000)</label>
            <input id="offer-price" type="number" min="0" step="1" class="form-input" required />
          </div>
          <div>
            <label class="form-label" data-i18n="admin.currency">Devise (ISO)</label>
            <select id="offer-currency" class="form-input">
              <option value="XOF">XOF (Franc CFA)</option>
              <option value="EUR">EUR (Euro)</option>
              <option value="USD">USD (Dollar)</option>
              <option value="XAF">XAF (Franc CFA BEAC)</option>
              <option value="GHS">GHS (Cedi)</option>
            </select>
          </div>
        </div>

        <!-- Lien de paiement externe (Tunnel de vente) -->
        <label class="form-label">Lien de paiement externe (Tunnel de vente)</label>
        <input id="offer-sales-link" type="url" class="form-input" placeholder="https://..." required />

        <!-- Actif -->
        <label class="checkbox-row">
          <input id="offer-active" type="checkbox" checked />
          <span data-i18n="admin.isActive">Offre active (visible publiquement)</span>
        </label>

        <!-- ============ Champs produit numérique ============ -->
        <fieldset id="digital-fields" class="fieldset">
          <legend data-i18n="admin.digitalLegend">Fichier numérique</legend>
          <button type="button" id="uploadcare-trigger" class="btn btn-secondary">
            <span data-i18n="admin.chooseFile">Choisir un fichier (Uploadcare)</span>
          </button>
          <div id="uploadcare-info" class="uploadcare-info hidden"></div>
          <input type="hidden" id="offer-uuid" />
          <input type="hidden" id="offer-file-name" />
          <input type="hidden" id="offer-file-size" />
        </fieldset>

        <!-- ============ Champs service ============ -->
        <fieldset id="service-fields" class="fieldset hidden">
          <legend data-i18n="admin.serviceLegend">Configuration du service</legend>

          <label class="form-label" data-i18n="admin.serviceMode">Mode de service</label>
          <select id="offer-service-mode" class="form-input">
            <option value="instructions" data-i18n="admin.modeInstructions">Instructions simples</option>
            <option value="rdv" data-i18n="admin.modeRdv">Rendez-vous</option>
            <option value="private_link" data-i18n="admin.modePrivateLink">Lien privé</option>
            <option value="private_group" data-i18n="admin.modePrivateGroup">Groupe privé</option>
          </select>

          <label class="form-label" data-i18n="admin.instructionsFr">Instructions (FR)</label>
          <textarea id="offer-instructions-fr" class="form-input" rows="3"></textarea>

          <label class="form-label" data-i18n="admin.instructionsEn">Instructions (EN)</label>
          <textarea id="offer-instructions-en" class="form-input" rows="3"></textarea>

          <label class="form-label" data-i18n="admin.privateLink">Lien privé (optionnel)</label>
          <input id="offer-private-link" type="url" class="form-input" placeholder="https://..." />

          <label class="form-label" data-i18n="admin.bookingLink">Lien de réservation (optionnel)</label>
          <input id="offer-booking-link" type="url" class="form-input" placeholder="https://..." />

          <label class="form-label" data-i18n="admin.contact">Contact (optionnel)</label>
          <input id="offer-contact" type="text" class="form-input" placeholder="WhatsApp / Telegram..." />
        </fieldset>

        <!-- ============ Liens sociaux (commun) ============ -->
        <fieldset class="fieldset">
          <legend data-i18n="admin.socialLegend">Liens sociaux / contact (optionnel)</legend>
          <div class="form-row">
            <div>
              <label class="form-label">WhatsApp</label>
              <input id="offer-social-whatsapp" type="url" class="form-input" placeholder="https://wa.me/..." />
            </div>
            <div>
              <label class="form-label">Telegram</label>
              <input id="offer-social-telegram" type="url" class="form-input" placeholder="https://t.me/..." />
            </div>
          </div>
          <div class="form-row">
            <div>
              <label class="form-label">Facebook</label>
              <input id="offer-social-facebook" type="url" class="form-input" placeholder="https://facebook.com/..." />
            </div>
            <div>
              <label class="form-label">Instagram</label>
              <input id="offer-social-instagram" type="url" class="form-input" placeholder="https://instagram.com/..." />
            </div>
          </div>
        </fieldset>

        <div id="offer-form-error" class="form-error hidden"></div>

        <div class="form-actions">
          <button type="button" class="btn btn-ghost" data-close-offer-modal data-i18n="admin.cancel">Annuler</button>
          <button type="submit" class="btn btn-primary" data-i18n="admin.save">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="../js/firebase-config.js"></script>
  <script type="module" src="../js/i18n.js"></script>
  <script type="module" src="../js/uploadcare-config.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
